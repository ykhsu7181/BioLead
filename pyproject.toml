[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "literature-agent"
version = "0.1.0"
description = "A first prototype scaffold for a literature analysis agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
literature-agent = "literature_agent.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
